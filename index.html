<!DOCTYPE html> <!--serve para indicar a programação utilizada-->
<html lang="pt-br"> <!-- abertura que delimita o documento, todas as tags devem ficar dentro desse espaço.-->
<head> <!--define o cabeçalho do documento, as informações colocadas dentro desse limite, não aparecem no navegador, mas contém instruções sobre seu conteúdo. Dentro dessa teg podemos colocar folhas de estilo e script.-->
    <meta charset="UTF-8"> <!-- especifica qual conjunto de carcteres (character set ou charset) será usado para renderizar (converter o código em um arquivo) o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- fonecem os metadados sobre a sua página.-->
    <title>Portfólio</title> <!-- é o título do seu documento-->
</head> <!--fechamento da tag do cabeçalho.-->
<body> <!-- abertura da tag, marcando o espaço no qual deve estar contido o conteúdo visual da página. As demais tags que representam texto, botões, etc. devem ser adicionadas nesse intervalo.-->
    <!-- um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como no caso da tag meta. Outro aspecto importante da linguagem é que ela é cas insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas, sendo assim, as tags podem ser escritas das duas maneiras.-->
    <!-- No HTML há seis níveis de cabeçalhos\títulos que podem ser usados por meio das tags h1, h2, h3, h4, h5 e h6, sendo o h1 o mais relevante e o h6 o menor\menos relevante.-->
     <h1> Matemática</h1>
     <h2> Operações</h2>
     <h3> Adição</h3>
     <h4> Subtração</h4>
     <h5> Multplicação</h5>
     <h6> Divisão</h6>

     <!-- Parágrafos de texto são gerados em HTML por meio das tags <P> </P>. Esse é um exemplo de tag cuja disposição na tela se dá em forma de bloco, ou seja, um parágrafo é colocado sempre embaixo do outro.-->
   
     <p> Esses desenho é sobre um garoto que foi congelado por 100 anos após descobrir que era o avatar. Aang é um jovem menino que nasceu na.....
     </p>
     <p> Ele foi encontrado pela Katara e seu irmão Sooka.</p>

    <img src="img/images (1).jpeg" 
</body> <!-- fechamento da tag do corpo do projeto.-->
</html> <!-- fechamento do documento-->
