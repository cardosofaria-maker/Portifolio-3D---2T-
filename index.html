<!DOCTYPE html> <!--serve para indicar a programação\\
ultilizada. -->
<html lang="pt-br"> <!-- abertura que delimita o
    documento, todas as tags devem ficar dentro desse espaço.-->
<head> <!--define de cabeçalho do documento, as informações colocadas dentro limite, não aparecem no navegador mais contém instruções desse conteudo. Dentro dessa tag podemos colocar folhas e estilo e scrip. -->
    <meta charset="UTF-8"> <!-- especifica qual o cojunto de caracteres (character set ou charset) será usado para renderizar (converter o código em um arquivo) o texto da página. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fonecem os metadados  sobre a página. -->
    <title>portifolio</title> <!-- é o título do seu documento.-->
</head> <!-- fechameto da tag do cabeçalho.-->
<body> <!-- abertura da tag, marcado o espaço no qual deve estar contido e estar contido o conteúdo. -->
    
</body> <!-- fechamento da tag do corpo do projeto.-->
</html> <!-- fechamento do documento. -->
